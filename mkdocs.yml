site_name: Warden
site_url: https://warden.readthedocs.io/en/latest/
site_description: A macOS menu bar app for Claude Code and Codex.
repo_url: https://github.com/fus3r/warden
repo_name: fus3r/warden
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/screenshots.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

nav:
  - Overview: index.md
  - Get started:
      - Install Warden: getting-started.md
      - Connect your sessions: guide/connections.md
  - User guide:
      - Find a guide: usage.md
      - Sessions and the menu: guide/sessions.md
      - Approvals and questions: guide/prompts.md
      - Notifications and sounds: guide/notifications.md
      - Context and quotas: guide/limits.md
      - History and reports: guide/history.md
      - Work Planner: guide/planner.md
  - Long jobs and devices:
      - train-guard: guide/train-guard.md
      - Keep Awake: guide/power.md
      - Phone access: guide/phone.md
      - Automations: guide/automations.md
  - Reference:
      - Sources and privacy: reference/privacy.md
      - Troubleshooting: reference/troubleshooting.md
  - Development:
      - Build and contribute: development.md
      - Release Warden: releasing.md

exclude_docs: |
  /requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
